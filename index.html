  <style>
    :root {
      --fox-orange: #ff6d00;
      --fox-blue: #4255ff;
      --fox-dark: #2c2d33;
      --fox-bg: #f4f6f8;
      --white: #ffffff;
      --border: #e0e4e8;
      --gold: #ffc107;
      --green: #27ae60;
      --red: #eb4d4b;
    }

    body {
      margin: 0;
      font-family: 'Inter', -apple-system, sans-serif;
      background-color: var(--fox-bg);
      color: var(--fox-dark);
    }

    .game-stats {
      background: var(--fox-dark);
      color: white;
      padding: 12px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .xp-bar-container {
      flex-grow: 1;
      height: 14px;
      background: #444;
      margin: 0 30px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #555;
    }

    .xp-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--fox-orange), var(--gold));
      transition: width 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .level-badge {
      background: var(--fox-orange);
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 13px;
      text-transform: uppercase;
    }

    .tabs-nav {
      background: var(--white);
      display: flex;
      justify-content: center;
      gap: 15px;
      padding: 15px 0;
      border-bottom: 1px solid var(--border);
    }

    .tab-link {
      padding: 10px 25px;
      cursor: pointer;
      font-weight: 600;
      border-radius: 12px;
      transition: 0.3s;
      border: 1px solid transparent;
    }

    .tab-link.active {
      background: var(--fox-blue);
      color: white;
      box-shadow: 0 4px 12px rgba(66, 85, 255, 0.3);
    }

    .main-layout {
      display: grid;
      grid-template-columns: 280px 1fr 250px;
      gap: 25px;
      max-width: 1400px;
      margin: 25px auto;
      padding: 0 20px;
    }

    .task-card {
      background: var(--white);
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      position: relative;
      border: 2px solid transparent;
    }

    .task-card.correct-anim { border-color: var(--green); animation: pop 0.4s ease; }
    .task-card.wrong-anim { animation: shake 0.4s ease; }

    .xp-reward {
      position: absolute;
      top: 15px;
      right: 20px;
      color: var(--gold);
      font-weight: 900;
    }

    .answer-section {
      display: flex;
      gap: 12px;
      margin-top: 25px;
    }

    input {
      padding: 12px;
      border: 2px solid var(--border);
      border-radius: 10px;
      width: 150px;
      font-size: 20px;
      text-align: center;
    }

    .btn-check {
      background: var(--fox-blue);
      color: white;
      border: none;
      padding: 10px 30px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      box-shadow: 0 4px 0 #2a36aa;
    }

    .btn-next {
      background: var(--green);
      display: none;
    }

    .sidebar {
      background: var(--white);
      padding: 25px;
      border-radius: 20px;
      height: fit-content;
      position: sticky;
      top: 100px;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }
    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.02); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

<div class="game-stats">
  <div><span id="level-text">Уровень 1</span> <span class="level-badge" id="rank">Новичок</span></div>
  <div class="xp-bar-container">
    <div class="xp-bar-fill" id="xp-fill"></div>
  </div>
  <div>XP: <span id="current-xp">0</span> / 100</div>
</div>

<div class="tabs-nav">
  <div class="tab-link active" onclick="setGrade(5)">5 Класс</div>
  <div class="tab-link" onclick="setGrade(6)">6 Класс</div>
  <div class="tab-link" onclick="setGrade(7)">7 Класс</div>
</div>

<div class="main-layout">
  <aside class="sidebar">
    <h3>📜 Справочник</h3>
    <div id="formula-hint">Выберите класс...</div>
  </aside>

  <main id="task-container">
    <!-- Здесь будет появляться задача -->
    <div class="task-card" id="active-card">
      <div class="xp-reward">+25 XP</div>
      <h2 id="task-title">Загрузка...</h2>
      <p id="task-text" style="font-size: 22px;"></p>
      <div class="answer-section">
        <input type="number" id="user-ans" placeholder="Ответ">
        <button class="btn-check" id="check-btn" onclick="checkAnswer()">Проверить</button>
        <button class="btn-check btn-next" id="next-btn" onclick="generateTask()">Следующая задача</button>
      </div>
      <p id="feedback"></p>
    </div>
  </main>

  <aside class="sidebar">
    <h3>🏆 Прогресс</h3>
    <p id="solved-text">Решено задач: 0</p>
    <div id="medals" style="font-size: 28px;"></div>
    <hr>
    <button class="reset-btn" style="cursor:pointer; opacity:0.5" onclick="resetProgress()">Сбросить всё</button>
  </aside>
</div>

<script>
  let state = {
    xp: parseInt(localStorage.getItem('ftl_xp')) || 0,
    level: parseInt(localStorage.getItem('ftl_level')) || 1,
    solvedCount: parseInt(localStorage.getItem('ftl_solved_count')) || 0,
    currentGrade: 5,
    currentCorrectAns: null
  };

  const formulas = {
    5: "<b>Проценты:</b> Часть = (Всего * %) / 100",
    6: "<b>Числа:</b> -a - b = -(a + b)<br><b>Умножение:</b> (-) * (-) = (+)",
    7: "<b>Уравнения:</b> Раскрой скобки, иксы влево, числа вправо."
  };

  function setGrade(g) {
    state.currentGrade = g;
    document.querySelectorAll('.tab-link').forEach((el, i) => {
      el.classList.toggle('active', (i + 5) === g);
    });
    document.getElementById('formula-hint').innerHTML = formulas[g];
    generateTask();
  }

  function generateTask() {
    const card = document.getElementById('active-card');
    const feedback = document.getElementById('feedback');
    const input = document.getElementById('user-ans');

    card.className = "task-card";
    feedback.innerText = "";
    input.value = "";
    input.disabled = false;
    document.getElementById('check-btn').style.display = "block";
    document.getElementById('next-btn').style.display = "none";

    let task = { text: "", ans: 0, title: "" };

    if (state.currentGrade === 5) {
      const type = Math.random() > 0.5;
      if (type) {
        let base = Math.floor(Math.random() * 20 + 1) * 50;
        let perc = Math.floor(Math.random() * 9 + 1) * 5;
        task.title = "Проценты";
        task.text = `Найдите ${perc}% от числа ${base}`;
        task.ans = (base * perc) / 100;
      } else {
        let res = Math.floor(Math.random() * 10 + 1) * 9;
        let proc = 18;
        task.title = "Яблоки (пропорция)";
        task.text = `Сколько свежих яблок (кг) нужно, чтобы получить ${res} кг сушеных (выход ${proc}%)?`;
        task.ans = Math.round(res / (proc/100));
      }
    }
    else if (state.currentGrade === 6) {
      let a = Math.floor(Math.random() * 50) - 25;
      let b = Math.floor(Math.random() * 50) - 25;
      task.title = "Отрицательные числа";
      task.text = `Вычислите: ${a} + (${b})`;
      task.ans = a + b;
    }
    else if (state.currentGrade === 7) {
      // Генерация уравнения a(x - b) = c, где x - целое
      let x = Math.floor(Math.random() * 10) + 1;
      let a = Math.floor(Math.random() * 5) + 2;
      let b = Math.floor(Math.random() * 5) + 1;
      let c = a * (x - b);
      task.title = "Линейное уравнение";
      task.text = `Решите уравнение: ${a}(x - ${b}) = ${c}`;
      task.ans = x;
    }

    state.currentCorrectAns = task.ans;
    document.getElementById('task-title').innerText = task.title;
    document.getElementById('task-text').innerText = task.text;
  }

  function checkAnswer() {
    const userVal = parseFloat(document.getElementById('user-ans').value);
    const card = document.getElementById('active-card');
    const feedback = document.getElementById('feedback');

    if (userVal === state.currentCorrectAns) {
      feedback.innerHTML = "✨ Великолепно! Правильный ответ.";
      feedback.style.color = "var(--green)";
      card.classList.add('correct-anim');
      document.getElementById('user-ans').disabled = true;
      document.getElementById('check-btn').style.display = "none";
      document.getElementById('next-btn').style.display = "block";

      updateXP(25);
      state.solvedCount++;
      save();
      updateUI();
    } else {
      feedback.innerHTML = "❌ Ошибка в расчетах. Попробуй еще раз!";
      feedback.style.color = "var(--red)";
      card.classList.remove('wrong-anim');
      void card.offsetWidth;
      card.classList.add('wrong-anim');
    }
  }

  function updateXP(amount) {
    state.xp += amount;
    if (state.xp >= 100) {
      state.xp -= 100;
      state.level++;
      alert("🚀 Уровень повышен! Новый уровень: " + state.level);
    }
  }

  function updateUI() {
    document.getElementById('level-text').innerText = "Уровень " + state.level;
    document.getElementById('current-xp').innerText = state.xp;
    document.getElementById('xp-fill').style.width = state.xp + "%";
    document.getElementById('solved-text').innerText = "Решено задач: " + state.solvedCount;

    const ranks = ["Новичок", "Ученик", "Мастер", "Профи", "Легенда"];
    document.getElementById('rank').innerText = ranks[Math.min(state.level - 1, 4)];

    const m = document.getElementById('medals');
    m.innerHTML = state.solvedCount >= 5 ? "🥉 " : "";
    if(state.solvedCount >= 15) m.innerHTML += "🥈 ";
    if(state.solvedCount >= 30) m.innerHTML += "🥇 ";
  }

  function save() {
    localStorage.setItem('ftl_xp', state.xp);
    localStorage.setItem('ftl_level', state.level);
    localStorage.setItem('ftl_solved_count', state.solvedCount);
  }

  function resetProgress() {
    if(confirm("Сбросить весь прогресс?")) {
      localStorage.clear();
      location.reload();
    }
  }

  // Запуск
  window.onload = () => {
    setGrade(5);
    updateUI();
  };

  document.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
      if (document.getElementById('check-btn').style.display !== "none") {
        checkAnswer();
      } else {
        generateTask();
      }
    }
  });
</script>
</body>
</html>
